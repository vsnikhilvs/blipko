name: cron-tick

# Every 10 minutes:
#   1. GET /health  — keeps the Render backend from spinning down
#   2. POST /api/cron/tick — nudges, cycle report, recurring (each job
#      still self-gates on the user's local hour)
#
# Set repo secrets: RENDER_API_URL (no trailing slash), CRON_SECRET.
# GitHub schedule cron can drift a few minutes; 10 min stays inside Render's
# idle window. Runs on a schedule + on-demand via the Actions tab.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Render awake (GET /health)
        run: |
          curl --fail --retry 8 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            "${{ secrets.RENDER_API_URL }}/health"

      - name: POST /api/cron/tick
        run: |
          code=$(curl -sS -o /tmp/out -w "%{http_code}" -X POST \
            "${{ secrets.RENDER_API_URL }}/api/cron/tick" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/out; echo
          test "$code" = "200"
